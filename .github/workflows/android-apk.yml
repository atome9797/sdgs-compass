name: Android APK (demo)

# 발표 때 휴대폰에 설치해서 보여 주는 "독립 실행" 데모 APK 를 만들어요 (개발 서버·Metro 없이 JS 번들이 들어 있는 release 빌드).
# main 에 모바일 관련 변경이 푸시되면 자동으로 빌드하고, GitHub Release(태그 demo-latest)에 APK 를 올려요 → Releases 페이지에서 내려받아 설치해요.
# feat/** 브랜치에서도 빌드는 해 보지만(APK 는 Artifacts 에만 남아요), Release 에는 main 에서만 올려요.
# 수동 실행(Actions › Android APK (demo) › Run workflow)도 돼요.
#
# 서명: Expo 템플릿이 만드는 "공개 debug.keystore" 로 서명한 데모용 APK 예요. 스토어 배포용이 아니에요.
#       (설치할 때 "출처를 알 수 없는 앱" 허용이 필요해요.)
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      abis:
        description: "빌드할 CPU 구조 (기본 arm64-v8a = 대부분의 실제 폰. 안드로이드 에뮬레이터는 x86_64 를 더하세요. 예: arm64-v8a,x86_64)"
        type: string
        default: "arm64-v8a"
      publish:
        description: "GitHub Release(demo-latest)에 APK 올리기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: release APK (arm64)
    # ubuntu-latest 가 새 이미지로 옮겨 가는 중이라, NDK·Gradle 빌드는 검증된 24.04 이미지에 고정해요.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_GIT_STATUS: "1"
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v7

      # 러너의 디스크가 NDK 빌드에 모자라지 않도록 쓰지 않는 도구를 지웁니다.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: ${{ hashFiles('package-lock.json') != '' }}

      - name: Install dependencies
        run: bash .github/scripts/run-step.sh "npm install" bash -c 'if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi'

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Prebuild Android
        working-directory: apps/mobile
        run: bash ../../.github/scripts/run-step.sh "prebuild android" npx expo prebuild --platform android --no-install --clean

      # release 빌드는 lint·R8 같은 단계가 더 있어서 Expo 템플릿 기본 메모리(2GB)로는 모자랄 수 있어요 (러너는 16GB)
      # (템플릿의 gradle.properties 는 끝에 줄바꿈이 없어서, 그냥 덧붙이면 마지막 설정과 한 줄로 붙어 버려요
      #  → expo.inlineModules.watchedDirectories 값이 깨져서 generateInlineModules 가 실패했어요. 먼저 줄바꿈을 보장해요.)
      - name: Gradle memory
        working-directory: apps/mobile/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          if [ -n "$(tail -c1 gradle.properties)" ]; then echo >> gradle.properties; fi
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          tail -n 8 gradle.properties

      - name: Assemble release APK (JS 번들 포함)
        working-directory: apps/mobile/android
        run: bash ../../../.github/scripts/run-step.sh "gradle assembleRelease" ./gradlew :app:assembleRelease "-PreactNativeArchitectures=${ABIS}" --no-daemon --stacktrace

      # Expo 템플릿의 release 빌드는 공개 debug.keystore 로 서명돼요. 혹시 서명이 없으면(unsigned) 같은 키로 서명해요.
      # apksigner 로 서명을 확인하고, 인증서 지문을 기록해요.
      - name: Verify (or debug-sign) the APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools=$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)
          dir=app/build/outputs/apk/release
          ls -la "$dir"
          apk=$(ls "$dir"/*.apk | head -n 1)
          if ! "$build_tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::notice::서명이 없어서 Expo 템플릿의 공개 debug.keystore 로 서명해요"
            "$build_tools/zipalign" -f -p 4 "$apk" aligned.apk
            "$build_tools/apksigner" sign --ks app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out signed.apk aligned.apk
            apk=signed.apk
          fi
          "$build_tools/apksigner" verify --print-certs "$apk" | tee apk-certs.txt
          grep -q "SHA-1 digest" apk-certs.txt
          # 이 앱에 필요 없는 권한(app.config.ts 의 android.blockedPermissions)이 APK 에 남지 않았는지 확인하고, 실제 권한 목록을 요약에 남겨요.
          "$build_tools/aapt2" dump permissions "$apk" | tee apk-permissions.txt
          if grep -E "READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|SYSTEM_ALERT_WINDOW|VIBRATE" apk-permissions.txt; then
            echo "::error::불필요한 권한이 APK 에 남아 있어요 (apps/mobile/app.config.ts 의 android.blockedPermissions 를 확인하세요)"
            exit 1
          fi
          echo "::notice title=APK 권한::$(grep -o "name='[^']*'" apk-permissions.txt | tr '\n' ' ')"
          cp "$apk" "$GITHUB_WORKSPACE/sdgs-compass-demo.apk"
          ls -la "$GITHUB_WORKSPACE/sdgs-compass-demo.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: sdgs-compass-demo-apk
          path: sdgs-compass-demo.apk
          retention-days: 14

      # 항상 같은 주소(…/releases/download/demo-latest/sdgs-compass-demo.apk)에서 최신 APK 를 받을 수 있게
      # 이전 demo-latest 릴리스와 태그를 지우고 이번 커밋에서 다시 만들어요.
      - name: Publish GitHub Release (demo-latest)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256=$(sha256sum sdgs-compass-demo.apk | cut -d' ' -f1)
          short="${GITHUB_SHA::7}"
          {
            echo "공모전 시연용 **데모 APK** 예요 (커밋 \`${short}\`). 서버·로그인 없이 샘플 데이터로 동작하고, 일본어/한국어를 고를 수 있어요."
            echo
            echo "- 설치: 휴대폰(Android)에서 이 APK 를 내려받아 열고, \"출처를 알 수 없는 앱\" 설치를 허용해요."
            echo "- CPU 구조: \`${ABIS}\`"
            echo "- SHA-256: \`${sha256}\`"
            echo "- 공개 debug 키로 서명한 데모용이라 스토어 배포용이 아니에요."
          } > release-notes.md
          gh release delete demo-latest --cleanup-tag --yes || true
          gh release create demo-latest sdgs-compass-demo.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SDGsコンパス 데모 APK (최신)" \
            --notes-file release-notes.md
